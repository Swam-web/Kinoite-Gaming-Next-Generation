# Le module default-flatpaks@v2 met Wants=network-online.target dans une
# unité *user* : no-op, le gestionnaire user n'a pas ce target. Le timer
# déclenche à +30 s, souvent avant que le WiFi soit associé -> flatpak
# install échoue et rien ne se réessaie avant le prochain boot.
# Restart=on-failure sur un oneshot : reessaie toutes les 60 s (max 15
# tentatives sur 15 min) jusqu'à ce que le réseau soit réellement up.
[Service]
Restart=on-failure
RestartSec=60s

[Unit]
StartLimitIntervalSec=900
StartLimitBurst=15
