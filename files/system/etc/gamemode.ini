; Réglages GameMode — station de jeu.
; S'applique à tous les utilisateurs (/etc) ; surcharge possible dans
; ~/.config/gamemode.ini.
;
; renice : la valeur est NÉGÉE par gamemode (10 -> nice -10 sur le jeu,
;   cf. example/gamemode.ini upstream). Un nice négatif est autorisé par les
;   limites PAM etc/security/limits.d/swam-gamemode.conf (RLIMIT_NICE du
;   PROCESSUS CIBLE = le jeu, appliqué à la connexion). Mécanisme upstream ;
;   AmbientCapabilities sur l'unité *user* gamemoded est inopérant (le user
;   manager non privilégié ne peut pas élever de capabilities).
; ioprio volontairement ABSENT : le défaut BE/0 est déjà la priorité IO
;   maximale — toute valeur 1..7 dégraderait le jeu (0 = le plus prioritaire).
; desiredgov : gouverneur CPU « performance » pendant la partie
;   (retour à l'état initial en sortie de jeu).
; softrealtime=auto : SCHED_ISO si le kernel le supporte — no-op propre ici,
;   le kernel CachyOS n'embarque pas SCHED_ISO et « auto » le gère.
; reaper_freq : fréquence (s) de surveillance des fils du jeu.
[general]
reaper_freq=5
desiredgov=performance
softrealtime=auto
renice=10
