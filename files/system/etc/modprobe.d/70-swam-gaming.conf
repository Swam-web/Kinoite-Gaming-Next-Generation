# swam-os — latence périphériques gaming
#
# Manettes Bluetooth (DualSense/DualShock, Switch Pro) :
#   ERTM (Enhanced Retransmission) casse l'appairage direct et ajoute de la
#   latence de retransmission — SteamOS/Bazzite le désactivent par défaut.
options bluetooth disable_ertm=y

# Audio : pas d'économie d'énergie HDA — sinon craquements et latence du
# premier son (incohérent avec le quantum PipeWire 256 de l'image).
# Desktop toujours alimenté : le power-save n'apporte rien.
options snd_hda_intel power_save=0 power_save_controller=N

# WiFi MediaTek MT7927 (driver mt7925e) : ASPM off — évite le jitter PCIe
# en jeu en ligne. Sans effet sur les machines sans ce chipset.
options mt7925e disable_aspm=1
