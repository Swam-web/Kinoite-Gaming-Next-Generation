### Overlay MangoHud — configuration système.
###
### Chemin lu par libMangoHud : /etc/MangoHud.conf (vérifié dans le binaire Fedora).
### Si ta version ne le lit pas, copie simplement ce fichier dans :
###     ~/.config/MangoHud/MangoHud.conf
###
### MangoHud ne s'affiche QUE lorsqu'il est activé : MANGOHUD=1, le wrapper
### `mangohud`, ou gamemode. Ce fichier ne fait que définir ce qu'il montre.
### Basculer l'affichage en jeu : Shift droit + F12.

# --- GPU ---
gpu_stats
gpu_temp
gpu_power
gpu_core_clock
gpu_mem_clock

# --- CPU / mémoire ---
cpu_stats
cpu_temp
ram
vram

# --- Images ---
fps
frametime
frame_timing

# --- Mise en page ---
position=top-left
font_size=24
toggle_hud=Shift_R+F12
