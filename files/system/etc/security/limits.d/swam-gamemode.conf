# GameMode : renice=-10 (gamemode.ini renice=10, valeur négée par gamemode).
# Le contrôle noyau porte sur le RLIMIT_NICE du PROCESSUS CIBLE (le jeu),
# hérité de la session PAM : ces limites suffisent — pas besoin de
# CAP_SYS_NICE sur gamemoded. AmbientCapabilities= est inopérant en unité
# *user* (le user manager non privilégié ne peut pas élever de
# capabilities) et faisait échouer le démarrage de gamemoded.
# Sélecteur `*` au lieu du groupe @gamemode : aucun utilisateur n'existe au
# build d'image. Mécanisme upstream (limits.d) — pattern Bazzite.
# Réglable par utilisateur : valeur entre -10 et 0.
*       -       nice    -10
