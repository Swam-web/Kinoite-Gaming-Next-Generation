# Réseau : BBR + fq — anti-bufferbloat en ligne.
# cachyos-settings (70-cachyos-settings.conf) ne les pose pas (vérifié) ;
# kernel CachyOS : CONFIG_TCP_CONG_BBR=m + CONFIG_NET_SCH_FQ=m — modules
# chargés au boot via etc/modules-load.d/swam-net.conf (défauts kernel :
# cubic + fq_codel).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Mémoire : max_map_count élevé — requis par certains gros jeux
# (Proton, Star Citizen…) ; défaut kernel 65530, trop bas.
# Valeur CachyOS ; ni le RPM kernel-cachyos ni cachyos-settings ne la posent.
vm.max_map_count = 2147483642

# Contention mémoire : réduit les stalls en faux-partage de verrous de pages
# (gros jeux multithread, VM). CachyOS le pose dans ses tuning récents ;
# défaut kernel 5. Binaire : 1 = verrous de pages traités comme unfair,
# même comportement que les verrous noyau internes.
vm.page_lock_unfairness = 1

# Anti-stall mémoire (gros jeux + zram) : pas de boost aggressif des
# watermarks (provoque des réveils kswapd en rafale), seuil de réveil
# élargi (125 → décisions de reclaim plus tôt, moins brutales), et pas
# de compaction proactive en continu (kcompactd au repos hors pression).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.compaction_proactiveness = 0
