# Latence audio gaming : quantum 256 @ 48 kHz ≈ 5,3 ms
# (défaut PipeWire : 1024 -> ~21 ms). La base Kinoite ne le règle pas.
# Les streams négocient autour de cette cible ; surcharge possible par
# utilisateur dans ~/.config/pipewire/pipewire.conf.d/.
# Si un casque BT / micro accroche : augmenter (512) ou supprimer le fichier.
context.properties = {
    default.clock.rate     = 48000
    default.clock.quantum  = 256
}
